# Optional reverse proxy in front of the app container.
server {
  listen 80;
  # docs/plan/admin-content-upload-base64/PLAN.md T1/K8: nginx default (1m)
  # rejects most admin photo uploads before they reach Go. 12m covers both
  # the base64 image endpoint (<=8m body) and multipart audio (<=10m).
  client_max_body_size 12m;
  location / {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
