# docs/plan/lighthouse-performance-optimization/nginx-elwedding.conf
# Manual step for VPS: /etc/nginx/sites-enabled/elwedding (K4, T30)
# PLAN lighthouse §3.8 — HTTP/2 + gzip. JANGAN tambah expires/add_header Cache-Control di sini,
# header cache sudah dari Go (router.go cacheControlForPath, D1) — dua sumber akan tabrakan.

# PENTING sebelum menempel:
#  1) `nginx -v` — `http2 on;` butuh nginx >= 1.25.1. Di versi lebih lama
#     directive ini TIDAK DIKENAL dan nginx GAGAL START. Untuk nginx < 1.25.1
#     hapus baris `http2 on;` dan pakai: listen 443 ssl http2;
#  2) `cat /etc/nginx/sites-enabled/elwedding` — vhost lama sudah memegang path
#     cert dan port yang benar. Terapkan sebagai perubahan BERTARGET
#     (tambah http2 + gzip), JANGAN menimpa seluruh file dengan blok ini.
#  3) `nginx -t` sebelum `systemctl reload nginx`.

server {
    listen 443 ssl;
    http2 on;                 # nginx >= 1.25.1; kalau lebih lama: listen 443 ssl http2;

    server_name elwedding.elcodelabs.com;

    # ssl — ganti path ke cert yang ada di VPS
    ssl_certificate     /etc/letsencrypt/live/elwedding.elcodelabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elwedding.elcodelabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # proxy ke Go — PORT 8083, BUKAN 8080.
    # elwedding-app meng-override APP_PORT ke 8083 justru untuk menghindari
    # tabrakan dengan elproof-app (8082) dan elkasir-app (8081) di VPS yang sama
    # (knowledge/AI_AGENT_OPERATIONS.md:102, knowledge/DEPLOYMENT.md:55).
    # Verifikasi dulu di VPS: docker ps --format '{{.Names}}	{{.Ports}}' | grep elwedding
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # penting untuk video/mp4 range
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_http_version 1.1;
    }

    # gzip — text & js (gambar sudah webp/mp4, tidak perlu)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    # font/woff2 TIDAK dimasukkan: woff2 sudah terkompresi, gzip hanya buang CPU

    # brotli bila modul tersedia (nginx-contrib)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript image/svg+xml;

    # JANGAN tambahkan:
    #   expires 30d;
    #   add_header Cache-Control ...;
    # karena Go sudah menyetel:
    #   /assets/<hash>.js|css -> public, max-age=31536000, immutable
    #   /media/*,/vendor/*,/assets/* -> public, max-age=2592000
    #   / , /admin -> no-cache

    # opsional: redirect http -> https
}
server {
    listen 80;
    server_name elwedding.elcodelabs.com;
    return 301 https://$host$request_uri;
}
