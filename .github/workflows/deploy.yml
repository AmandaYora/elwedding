name: Build and push image

# elcodelabs VPS convention (SERVER_PLAYBOOK.md): CI builds & pushes the
# image, the server only pulls & runs (never builds). This workflow is the
# CI half of that split - the server-side half is `~/elwedding/deploy.sh
# <git-sha>`, run manually after this job publishes the image.
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/amandayora/elwedding:${{ github.sha }}
            ghcr.io/amandayora/elwedding:latest
