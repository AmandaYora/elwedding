services:
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8080:8080"
    # Copy .env.example to .env before running compose.
    env_file:
      - .env
    volumes:
      # Foto/musik yang diunggah admin (keputusan #12 PLAN.md) - persist
      # antar deploy/rebuild image, terpisah dari build statis frontend.
      - uploads_data:/app/uploads
      # Sesi WhatsApp (dashboard-wa-rsvp keputusan #5) - file SQLite dibuat
      # whatsmeow sendiri, BUKAN MySQL. Wajib persist - kalau hilang, akun
      # WhatsApp harus di-pairing ulang lewat scan QR.
      - wa_store_data:/app/wa-store
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  uploads_data:
  wa_store_data:
